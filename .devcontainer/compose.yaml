services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:noble
    init: true
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ..:/workspaces:cached

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vscode
      POSTGRES_PASSWORD: vscode
      POSTGRES_DB: development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vscode -d development"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.10.1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
