services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:noble
    init: true
    command: sleep infinity
    depends_on:
      - postgres
      - redis
    volumes:
      - ..:/workspaces/my-dev-env:cached

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vscode
      POSTGRES_PASSWORD: vscode
      POSTGRES_DB: development
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.10.1
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
